[project]
name = "rvcfc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ricardo Vieira", email = "slrvcvieira@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "asgiref>=3.13.0",
    "async-generator>=1.10",
    "attrs>=26.1.0",
    "autopep8>=2.3.2",
    "certifi>=2026.10.23",
    "cffi>=2.1.1",
    "colorama>=0.4.6",
    "coverage>=7.17.0",
    "cryptography>=50.0.2",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-debug-toolbar>=8.0.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "docopt>=0.6.2",
    "faker>=40.44.0",
    "flake8>=7.5.0",
    "gunicorn>=26.2.0",
    "h11>=0.16.0",
    "idna>=3.20",
    "iniconfig>=2.3.1",
    "mccabe>=0.7.0",
    "mypy>=2.4.1",
    "mypy-extensions>=1.1.0",
    "outcome>=1.3.0.post0",
    "packaging>=26.3",
    "parameterized>=0.9.0",
    "pillow>=13.0.0",
    "pluggy>=1.7.0",
    "py>=1.11.0",
    "pycodestyle>=2.15.0",
    "pycparser>=3.12",
    "pyflakes>=4.1.0",
    "pyjwt>=2.15.1",
    "pyopenssl>=26.4.0",
    "pyparsing>=3.3.3",
    "python-dateutil>=3.0.0",
    "python-decouple>=3.8",
    "python-dotenv>=1.2.4",
    "pytz>=2026.6",
    "selenium>=4.52.0",
    "six>=1.17.0",
    "sniffio>=1.3.1",
    "sortedcontainers>=2.4.0",
    "sqlparse>=0.6.0",
    "text-unidecode>=1.3",
    "toml>=0.10.2",
    "trio>=0.34.0",
    "trio-websocket>=0.12.2",
    "typing-extensions>=4.16.0",
    "urllib3>=2.8.0",
    "watchdog>=6.0.0",
    "whitenoise>=6.12.0",
    "wsproto>=1.3.2",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-xdist",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py315"
fix = true
show-fixes = true
indent-width = 4
exclude = ["venv", ".venv", "env", ".env", "node_modules", "__pycache__"]

[tool.ruff.lint]
select = [
    "ASYNC",
    "A",
    "ANN",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FBT",
    "FIX",
    "I",
    "ICN",
    "ISC",
    "Q",
    "RET",
    "RSE",
    "S",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TC",
    "TD",
    "TRY",
    "UP",
    "W",
    "YTT",
    "RUF",
    "N",
]
ignore = ["T201", "COM812", "ANN201", "F401", "ANN001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
# Ensina ao Ruff qual é o pacote principal do seu projeto.
# Deve ser o mesmo nome da pasta dentro de 'src/'.
known-first-party = ["rvcfc"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.15"
include = ["src", 'tests']
exclude = [
    "**/venv",
    "**/.venv",
    "**/env",
    "**/.env",
    "**/node_modules",
    "**/__pycache__",
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "src" }]

[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
pythonpath = ["src"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "core.settings"
