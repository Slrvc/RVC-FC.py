{% extends "sistema/base.html" %}
{% block title %}Excluir {{ titulo }} · RVC-FC{% endblock %}
{% block content %}
  <div class="page-heading">
    <div>
      <p class="eyebrow">{{ titulo }}</p>
      <h1>Excluir registro</h1>
      <p class="page-description">Esta ação não pode ser desfeita.</p>
    </div>
  </div>
  <section class="panel">
    <p>Deseja realmente excluir <strong>{{ objeto }}</strong>?</p>
    <form method="post" class="form-actions">
      {% csrf_token %}
      <button class="button button-danger" type="submit">Excluir</button>
      <a class="button button-secondary" href="{% url 'lista_registros' recurso %}">Cancelar</a>
    </form>
  </section>
{% endblock %}
