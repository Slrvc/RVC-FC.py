<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/brands.min.css"
      integrity="sha512-m0oLz1v7KqlXtoyxY2LmR11D1iUnjOykxdeLg2FjtwKwPW78NYG5/XETzS+KDekWZqZIRsQNhPwpQuxtOQ4+nw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/solid.min.css"
      integrity="sha512-E5l6RuM1LLr8r+BTSEtKE9mqwPrO+HQNKbBacr303FoExXNvjq2dX7/0A3sV6OwusCkVmMRZ5zcSDwCziA+n8Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>{{ title }}</title>

    <style>
      /* ==========================================================
      RVC-FC | estilos base
      Ordem: variáveis > reset > base > cabeçalho > logo > autenticação
      ========================================================== */

      /* ---------- 1. Variáveis ---------- */
      :root {
        /* Marca (verde) */
        --color-container: #8bc34a;
        --color-container-hover: #6fa350;
        --color-container-dark: #4a7c2e;
        --color-container-dark-hover: #3e6b27;
        --color-container-light: #d5e6d5;
        --color-container-light-hover: #aed581;

        /* Logo */
        --color-logo: #2d5016;

        /* Ação (botões) */
        --color-action: #4a7c2e;
        --color-action-hover: #3e6b27;

        /* Primária (azul) */
        --color-primary: #269fe6;
        --color-primary-hover: #2086c2;
        --color-primary-dark: #13141f;
        --color-primary-dark-hover: #212336;
        --color-primary-light: #d4ecfa;
        --color-primary-light-hover: #bdd8e7;

        /* Secundária (laranja) */
        --color-secondary: #f39c12;
        --color-secondary-hover: #e08e0b;
        --color-secondary-dark: #b36b00;
        --color-secondary-dark-hover: #995c00;
        --color-secondary-light: #fce5b4;
        --color-secondary-light-hover: #f9d78a;

        /* Texto e neutros */
        --color-dark-white: #fff;
        --color-dark-black: #000;
        --color-dark-text: #444;

        --color-gray-0: #f9f9f9;
        --color-gray-1: #e0e0e0;
        --color-gray-2: #c7c7c7;
        --color-gray-3: #aeaeae;
        --color-gray-4: #959595;
        --color-gray-5: #7d7d7d;
        --color-gray-6: #646464;
        --color-gray-7: #4b4b4b;
        --color-gray-8: #323232;
        --color-gray-9: #191919;

        /* Mensagens */
        --color-info-light: #cce5ff;
        --color-debug-light: #cce5ff;
        --color-success-light: #d4edda;
        --color-alert-light: #fff3cd;
        --color-warning-light: #fff3cd;
        --color-error-light: #f8d7da;

        --color-info-dark: #4d86c4;
        --color-debug-dark: #4d86c4;
        --color-success-dark: #4a9c5d;
        --color-alert-dark: #927f40;
        --color-warning-dark: #927f40;
        --color-error-dark: #da525d;

        /* Fontes */
        --font-primary: sans-serif;
        --font-headings: "Roboto Slab", serif;
        --font-logo-dosis: "Dosis", sans-serif;

        /* Espaçamento */
        --spacing-gutter-medium: 1rem;
        --spacing-gutter-large: 2rem;

        /* Sombras */
        --shadow-text: 3px 3px 6px rgba(0, 0, 0, 0.4);
        --shadow-button: 0 3px 6px rgba(0, 0, 0, 0.3);
        --shadow-button-hover: 0 6px 12px rgba(0, 0, 0, 0.4);
        --shadow-button-active: 0 2px 4px rgba(0, 0, 0, 0.3);
      }

      /* ---------- 2. Reset ---------- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ---------- 3. Base ---------- */
      html {
        font-size: 50%; /* 1rem = 8px */
      }

      body {
        font-family: var(--font-primary);
        font-size: 1rem;
        background-color: var(--color-container-light);
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: var(--font-headings);
      }

      /* ---------- 4. Cabeçalho ---------- */
      .main-header-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: var(--spacing-gutter-medium);
        padding: 1rem;
        background-color: var(--color-container-light-hover);
        box-shadow: var(--shadow-button-hover);
      }

      .container-left {
        display: flex;
        align-items: center;
      }

      .container-right {
        display: flex;
        align-items: center;
        gap: 2rem;
        padding-right: 1rem;
      }

      /* ---------- 5. Logo ---------- */
      .main-logo-link {
        display: flex;
        align-items: center;
        gap: 2rem;
        width: fit-content;
        color: inherit;
        text-decoration: none;
      }

      .main-logo-icon {
        font-size: 5rem;
        text-shadow: var(--shadow-text);
        color: var(--color-logo);
      }

      .main-logo-content {
        display: flex;
        flex-direction: column;
      }

      .main-logo-text {
        font-family: var(--font-logo-dosis);
        font-size: 5rem;
        color: var(--color-logo);
        text-shadow: var(--shadow-text);
      }

      .main-logo-description {
        font-family: var(--font-logo-dosis);
        font-size: 1.8rem;
        color: var(--color-logo);
      }

      /* ---------- 6. Autenticação (usuário e botão) ---------- */
      .user-info {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        font-size: 1.8rem;
        font-weight: 600;
      }

      .user-icon {
        font-size: 3rem;
      }

      .btn-auth {
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        padding: 1.3rem 1.8rem;
        border: none;
        border-radius: 6px;
        background: var(--color-action);
        color: var(--color-dark-white);
        font-family: inherit;
        font-size: 1.8rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        box-shadow: var(--shadow-button);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }

      .btn-auth:hover {
        background: var(--color-action-hover);
        transform: translateY(-2px);
        box-shadow: var(--shadow-button-hover);
      }

      .btn-auth:active {
        transform: translateY(0);
        box-shadow: var(--shadow-button-active);
      }

      .btn-auth:focus-visible {
        outline: 3px solid var(--color-dark-black);
        outline-offset: 3px;
      }

      /* ---------- 7. Busca ---------- */
      .search.container {
        width: min(100% - 4rem, 120rem);
        margin-inline: auto;
        padding-block: 4rem;
      }

      .search-form {
        display: flex;
        width: min(100%, 80rem);
        margin-inline: auto;
        overflow: hidden;
        border: 1px solid var(--color-gray-2);
        border-radius: 0.8rem;
        background-color: var(--color-dark-white);
        box-shadow: var(--shadow-button);
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .search-form:focus-within {
        border-color: var(--color-action);
        box-shadow: 0 0 0 3px var(--color-container-light-hover);
      }

      .search-input {
        flex: 1;
        min-width: 0;
        padding: 1.6rem 2rem;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--color-dark-text);
        font: inherit;
        font-size: 2rem;
      }

      .search-input::placeholder {
        color: var(--color-gray-5);
        opacity: 1;
      }

      .search-button {
        display: inline-flex;
        flex: 0 0 6rem;
        align-items: center;
        justify-content: center;
        border: 0;
        background-color: var(--color-action);
        color: var(--color-dark-white);
        font-size: 2.2rem;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .search-button:hover {
        background-color: var(--color-action-hover);
      }

      .search-button:focus-visible {
        outline: 3px solid var(--color-dark-black);
        outline-offset: -4px;
      }

      /* ---------- 8. Busca ---------- */
      .search.container {
        width: min(100% - 4rem, 120rem);
        margin-inline: auto;
        padding-block: 4rem;
      }

      .search-form {
        display: flex;
        width: min(100%, 80rem);
        margin-inline: auto;
        overflow: hidden;
        border: 1px solid var(--color-gray-2);
        border-radius: 0.8rem;
        background-color: var(--color-dark-white);
        box-shadow: var(--shadow-button);
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .search-form:focus-within {
        border-color: var(--color-action);
        box-shadow: 0 0 0 3px var(--color-container-light-hover);
      }

      .search-input {
        flex: 1;
        min-width: 0;
        padding: 1.6rem 2rem;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--color-dark-text);
        font: inherit;
        font-size: 2rem;
      }

      .search-input::placeholder {
        color: var(--color-gray-5);
        opacity: 1;
      }

      .search-button {
        display: inline-flex;
        flex: 0 0 6rem;
        align-items: center;
        justify-content: center;
        border: 0;
        background-color: var(--color-action);
        color: var(--color-dark-white);
        font-size: 2.2rem;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .search-button:hover {
        background-color: var(--color-action-hover);
      }

      .search-button:focus-visible {
        outline: 3px solid var(--color-dark-black);
        outline-offset: -4px;
      }
      /* ---------- 8. Acessibilidade ---------- */

      @media (prefers-reduced-motion: reduce) {
        .btn-auth {
          transition: none;
        }

        .btn-auth:hover {
          transform: none;
        }

        .search-form,
        .search-button {
          transition: none;
        }
      }
    </style>
  </head>
</html>
